name: pms
services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pms
      POSTGRES_DB: pms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
    ports: ['127.0.0.1:5434:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pms -d pms']
      interval: 5s
      retries: 20
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6381:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
  storage:
    profiles: ['s3']
    restart: unless-stopped
    # Community build pinned because the original MinIO registry image is unavailable.
    image: ghcr.io/coollabsio/minio@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-pms-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-unused-local-storage}
    ports: ['127.0.0.1:9002:9000', '127.0.0.1:9003:9001']
    volumes: ['storage-data:/data']
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mc alias set health http://127.0.0.1:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null && mc ready health',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
  mail:
    restart: unless-stopped
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  api:
    profiles: ['app']
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pms:${POSTGRES_PASSWORD}@postgres:5432/pms
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      S3_ENDPOINT: http://storage:9000
      SMTP_HOST: mail
    ports: ['127.0.0.1:4000:4000']
    volumes: ['./uploads:/app/uploads']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mail: { condition: service_started }
  worker:
    profiles: ['app']
    restart: unless-stopped
    build: .
    command: ['node', 'dist/src/jobs/worker.js']
    # The worker has no HTTP server; the image's API health probe does not apply.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pms:${POSTGRES_PASSWORD}@postgres:5432/pms
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      S3_ENDPOINT: http://storage:9000
      SMTP_HOST: mail
    volumes: ['./uploads:/app/uploads']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mail: { condition: service_started }
volumes:
  postgres-data:
  redis-data:
  storage-data:
