services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pms
      POSTGRES_DB: pms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run setup:env first}
    ports: ['127.0.0.1:5434:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pms -d pms']
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6381:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 20
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ['127.0.0.1:9002:9000', '127.0.0.1:9003:9001']
    volumes: ['storage-data:/data']
  mail:
    image: axllent/mailpit:v1.27
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
  api:
    profiles: ['app']
    restart: unless-stopped
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pms:${POSTGRES_PASSWORD}@postgres:5432/pms
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      SMTP_HOST: mail
    ports: ['127.0.0.1:4000:4000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
  worker:
    profiles: ['app']
    restart: unless-stopped
    build: .
    command: ['node', 'dist/src/jobs/worker.js']
    # The worker has no HTTP server; the image's API health probe does not apply.
    healthcheck:
      disable: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pms:${POSTGRES_PASSWORD}@postgres:5432/pms
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      SMTP_HOST: mail
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
volumes:
  postgres-data:
  redis-data:
  storage-data:
